version: 1
project: heizen
env: prod
region: us-east-1
awsProfile: default
domain: heizen.tech
ecr:
  image: 575751781540.dkr.ecr.us-east-1.amazonaws.com/workforce:production
  tag: latest
services:
  - name: frontend
    type: frontend
    port: 3000
    domain: heizen.tech
    wildcard: false
    cpu: small
    scaling:
      min: 1
      max: 3
      cpuTarget: 70
    command: npm run dev
    healthCheck:
      path: /
      codes: 200-499
  - name: backend
    type: backend
    port: 3001
    domain: api.heizen.tech
    cpu: small
    scaling:
      min: 2
      max: 5
      cpuTarget: 70
    command: npm run dev
    healthCheck:
      path: /api
      codes: 200-499
database:
  engine: postgres
  size: small
  deletionProtection: true
cache:
  engine: none
  size: small
storage:
  enabled: true
networking:
  nat: single
  vpcCidr: 10.0.0.0/16
  publicSubnet1Cidr: 10.0.1.0/24
  publicSubnet2Cidr: 10.0.2.0/24
  privateSubnet1Cidr: 10.0.3.0/24
  privateSubnet2Cidr: 10.0.4.0/24
